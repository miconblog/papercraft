<?xml version="1.0" encoding="UTF-8"?>
<!-- 자동 생성 파일. 고치려면 src/assets/games/soccer/artwork/ 를 고치고 `npm run artwork` 를 돌린다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148.5mm" viewBox="0 0 210 148.5" font-family="Noto Sans KR">
<title>축구 게임판 · 점수 기록칸</title>
<g id="pc-cut" fill="none" stroke="#000000" stroke-width="0.25" stroke-linecap="butt">
<rect x="5" y="5" width="200" height="138.5" />
</g>
