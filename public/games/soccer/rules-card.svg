<?xml version="1.0" encoding="UTF-8"?>
<!-- 자동 생성 파일. 고치려면 src/assets/games/soccer/artwork/ 를 고치고 `npm run artwork` 를 돌린다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="148.5mm" height="210mm" viewBox="0 0 148.5 210" font-family="Noto Sans KR">
<title>축구 게임판 · 게임 방법</title>
<g id="pc-cut" fill="none" stroke="#000000" stroke-width="0.25" stroke-linecap="butt">
<rect x="5" y="5" width="138.5" height="200" />
</g>
<g id="pc-art" fill="#1a1a1a" stroke="none">
<text x="13" y="17" font-size="5" dominant-baseline="central" text-anchor="start" font-weight="700">축구 게임판 · 게임 방법</text>
<text x="13" y="27.6" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">준비물</text>
<text x="13" y="32.5" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="32.5" font-size="3" dominant-baseline="central" text-anchor="start">연필 1자루(공을 튕기는 도구) · 가위 · 풀</text>
<text x="13" y="37.8" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="37.8" font-size="3" dominant-baseline="central" text-anchor="start">2명이 운동장을 사이에 두고 마주 앉는다.</text>
<text x="13" y="46.7" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">차리기</text>
<text x="13" y="51.6" font-size="3" dominant-baseline="central" text-anchor="start">1.</text>
<text x="17.6" y="51.6" font-size="3" dominant-baseline="central" text-anchor="start">골대 2개를 오려 접어 양쪽 골라인 안쪽 골대 자리에 세운다.</text>
<text x="13" y="56.9" font-size="3" dominant-baseline="central" text-anchor="start">2.</text>
<text x="17.6" y="56.9" font-size="3" dominant-baseline="central" text-anchor="start">둘이 팀을 하나씩 맡는다. 선수는 운동장에 인쇄되어 있고, 마커 옆 화살표가 그 팀이</text>
<text x="17.6" y="61.2" font-size="3" dominant-baseline="central" text-anchor="start">공격하는 방향이다.</text>
<text x="13" y="66.5" font-size="3" dominant-baseline="central" text-anchor="start">3.</text>
<text x="17.6" y="66.5" font-size="3" dominant-baseline="central" text-anchor="start">공 마커 하나를 센터 스팟에 놓는다. 나머지는 여분이다.</text>
<text x="13" y="71.8" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="71.8" font-size="3" dominant-baseline="central" text-anchor="start">두 팀은 운동장 전체에 섞여 서 있다. 상대 진영의 자기 팀 선수에게 패스해 밀고</text>
<text x="17.6" y="76.1" font-size="3" dominant-baseline="central" text-anchor="start">올라간다.</text>
<text x="13" y="85" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">패스 시도 — 한 턴에 3번</text>
<text x="13" y="89.9" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="89.9" font-size="3" dominant-baseline="central" text-anchor="start">자기 차례에는 연필로 공을 튕겨 자기 팀 선수에게 패스한다. 한 턴에 튕길 수 있는 것은</text>
<text x="17.6" y="94.2" font-size="3" dominant-baseline="central" text-anchor="start">최대 3번이다.</text>
<text x="13" y="99.5" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="99.5" font-size="3" dominant-baseline="central" text-anchor="start">공이 자기 팀 선수에 멈추면 패스 성공이다. 남은 시도 횟수가 다시 3번이 된다 — 패스가</text>
<text x="17.6" y="103.8" font-size="3" dominant-baseline="central" text-anchor="start">이어지는 한 턴은 끝나지 않는다.</text>
<text x="13" y="109.1" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="109.1" font-size="3" dominant-baseline="central" text-anchor="start">3번 안에 자기 팀 선수에게 연결하지 못하면 턴이 상대에게 넘어간다.</text>
<text x="13" y="114.4" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="114.4" font-size="3" dominant-baseline="central" text-anchor="start">튕긴 공이 상대 선수에 닿으면 그 자리에서 턴이 넘어간다. 시도 횟수가 남아 있어도</text>
<text x="17.6" y="118.7" font-size="3" dominant-baseline="central" text-anchor="start">마찬가지다.</text>
<text x="13" y="127.6" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">슛</text>
<text x="13" y="132.5" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="132.5" font-size="3" dominant-baseline="central" text-anchor="start">슛은 공이 자기 팀 선수 위에 있을 때만 할 수 있다.</text>
<text x="13" y="137.8" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="137.8" font-size="3" dominant-baseline="central" text-anchor="start">패스 시도 도중에 슛으로 바꿀 수는 없다. 한 번의 튕김이 패스인지 슛인지는 튕기기</text>
<text x="17.6" y="142.1" font-size="3" dominant-baseline="central" text-anchor="start">전에 정한다.</text>
<text x="13" y="147.4" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="147.4" font-size="3" dominant-baseline="central" text-anchor="start">공이 상대 골대 안에 들어가면 1점이다.</text>
<text x="13" y="156.3" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">점수 계산 — 시작 전에 하나를 고른다</text>
<text x="13" y="161.2" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="161.2" font-size="3" dominant-baseline="central" text-anchor="start">목표 점수제 — 먼저 정한 점수(예: 3점)에 도달한 쪽이 이긴다.</text>
<text x="13" y="166.5" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="166.5" font-size="3" dominant-baseline="central" text-anchor="start">시간제 — 정한 시간(예: 10분) 동안 더 많이 넣은 쪽이 이긴다.</text>
<text x="13" y="175.4" font-size="3.6" dominant-baseline="central" text-anchor="start" font-weight="700">이 규칙은 기본값입니다</text>
<text x="13" y="180.3" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="180.3" font-size="3" dominant-baseline="central" text-anchor="start">여기 적힌 것은 기본 규칙입니다. 둘이 합의해 자유롭게 바꿔서 즐기세요.</text>
<text x="13" y="185.6" font-size="3" dominant-baseline="central" text-anchor="start">·</text>
<text x="17.6" y="185.6" font-size="3" dominant-baseline="central" text-anchor="start">시작 전에 정해 두면 좋은 것 — 공이 운동장 밖으로 나갔을 때 어디서 다시 시작할지,</text>
<text x="17.6" y="189.9" font-size="3" dominant-baseline="central" text-anchor="start">패스 시도를 몇 번으로 할지, 손이 공에 닿았을 때(핸들링) 어떻게 할지.</text>
<text x="13" y="197.2" font-size="2.5" dominant-baseline="central" text-anchor="start" fill="#6b7280">운동장은 조금 두꺼운 종이(120g/m² 이상)에 뽑으면 공을 오래 튕겨도 잘 해지지 않습니다.</text>
</g>
</svg>
