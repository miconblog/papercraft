<text x="118" y="70" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">탭</text>
<rect x="60.54" y="40.05" width="32.92" height="3.9" fill="#ffffff" stroke="none" />
<text x="77" y="42" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">뚜껑 — 덮으면 위가 막힌다</text>
<rect x="36.1" y="40.05" width="3.8" height="3.9" fill="#ffffff" stroke="none" transform="rotate(-90 38 42)" />
<text x="38" y="42" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle" transform="rotate(-90 38 42)">귀</text>
<rect x="114.1" y="40.05" width="3.8" height="3.9" fill="#ffffff" stroke="none" transform="rotate(-90 116 42)" />
<text x="116" y="42" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle" transform="rotate(-90 116 42)">귀</text>
<rect x="70.81" y="96.05" width="12.38" height="3.9" fill="#ffffff" stroke="none" />
<text x="77" y="98" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">골대 바닥</text>
<rect x="61.125" y="117.05" width="31.75" height="3.9" fill="#ffffff" stroke="none" />
<text x="77" y="119" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">↑ 이 선을 골라인에 맞춘다</text>
<rect x="60.54" y="128.05" width="32.92" height="3.9" fill="#ffffff" stroke="none" />
<text x="77" y="130" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">입술 — 운동장 위에 얹는다</text>
<text x="152" y="32" font-size="4" dominant-baseline="central" text-anchor="start">접는 법</text>
<text x="152" y="40.1" font-size="3.2" dominant-baseline="central" text-anchor="start">1.</text>
<text x="157.4" y="40.1" font-size="3.2" dominant-baseline="central" text-anchor="start">바깥 실선을 따라 가위로 오린다. 오릴 곳은 바깥 선 하나뿐이다 — 칼로 뚫을</text>
<text x="157.4" y="45.5" font-size="3.2" dominant-baseline="central" text-anchor="start">곳이 없다.</text>
<text x="152" y="50.9" font-size="3.2" dominant-baseline="central" text-anchor="start">2.</text>
<text x="157.4" y="50.9" font-size="3.2" dominant-baseline="central" text-anchor="start">일점쇄선은 인쇄면이 안쪽으로 오게 접는다. 뚜껑 양옆 귀에 그은 파선 둘만</text>
<text x="157.4" y="56.3" font-size="3.2" dominant-baseline="central" text-anchor="start">반대로, 바깥으로 접는다.</text>
<text x="152" y="61.7" font-size="3.2" dominant-baseline="central" text-anchor="start">3.</text>
<text x="157.4" y="61.7" font-size="3.2" dominant-baseline="central" text-anchor="start">뒷벽과 옆벽 둘을 세워 쟁반을 만든다. 바닥은 그대로 두고 앞은 열어 둔다 —</text>
<text x="157.4" y="67.1" font-size="3.2" dominant-baseline="central" text-anchor="start">거기가 골문이다.</text>
<text x="152" y="72.5" font-size="3.2" dominant-baseline="central" text-anchor="start">4.</text>
<text x="157.4" y="72.5" font-size="3.2" dominant-baseline="central" text-anchor="start">뒷벽 양 끝의 탭을 앞으로 접어 옆벽 안쪽에 댄다.</text>
<text x="152" y="77.9" font-size="3.2" dominant-baseline="central" text-anchor="start">5.</text>
<text x="157.4" y="77.9" font-size="3.2" dominant-baseline="central" text-anchor="start">옆벽 위의 겹을 안쪽으로 접어 내려 탭을 문다. 양쪽 다 물리면 쟁반이 모양을</text>
<text x="157.4" y="83.3" font-size="3.2" dominant-baseline="central" text-anchor="start">잡는다 — 풀은 쓰지 않는다.</text>
<text x="152" y="88.7" font-size="3.2" dominant-baseline="central" text-anchor="start">6.</text>
<text x="157.4" y="88.7" font-size="3.2" dominant-baseline="central" text-anchor="start">뚜껑을 앞으로 접어 덮고, 양옆 귀를 옆벽 바깥에 씌운다. 위가 막혀 골포스트를</text>
<text x="157.4" y="94.1" font-size="3.2" dominant-baseline="central" text-anchor="start">맞고 튄 공도 나가지 않는다. 공을 꺼낼 때는 뚜껑을 젖힌다.</text>
<text x="152" y="99.5" font-size="3.2" dominant-baseline="central" text-anchor="start">7.</text>
<text x="157.4" y="99.5" font-size="3.2" dominant-baseline="central" text-anchor="start">골라인 밖에 놓고 앞으로 뻗은 입술을 운동장 위에 얹는다. 입술 좌우 끝을</text>
<text x="157.4" y="104.9" font-size="3.2" dominant-baseline="central" text-anchor="start">골라인 눈금에 맞추면 골문 가운데가 맞는다.</text>
