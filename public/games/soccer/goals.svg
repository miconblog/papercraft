<g id="pc-art" fill="#1a1a1a" stroke="none">
<text x="105" y="14" font-size="5" dominant-baseline="central" text-anchor="middle">골대 전개도 · 2개</text>
<text x="105" y="21" font-size="3" dominant-baseline="central" fill="#6b7280" text-anchor="middle">입구 40×14mm · 깊이 16mm</text>
<text x="60" y="32" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">지붕</text>
<text x="60" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">골대 1</text>
<text x="32" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">옆벽</text>
<text x="88" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">옆벽</text>
<text x="32" y="58" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">발</text>
<text x="88" y="58" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">발</text>
<text x="150" y="32" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">지붕</text>
<text x="150" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">골대 2</text>
<text x="122" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">옆벽</text>
<text x="178" y="47" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">옆벽</text>
<text x="122" y="58" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">발</text>
<text x="178" y="58" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">발</text>
<text x="24" y="78" font-size="4" dominant-baseline="central" text-anchor="start">접는 법</text>
<text x="24" y="86.1" font-size="3.2" dominant-baseline="central" text-anchor="start">1.</text>
<text x="29.4" y="86.1" font-size="3.2" dominant-baseline="central" text-anchor="start">바깥 실선을 따라 오린다.</text>
<text x="24" y="91.5" font-size="3.2" dominant-baseline="central" text-anchor="start">2.</text>
<text x="29.4" y="91.5" font-size="3.2" dominant-baseline="central" text-anchor="start">일점쇄선은 모두 인쇄면이 바깥으로 오게 접는다.</text>
<text x="24" y="96.9" font-size="3.2" dominant-baseline="central" text-anchor="start">3.</text>
<text x="29.4" y="96.9" font-size="3.2" dominant-baseline="central" text-anchor="start">지붕을 앞으로 접어 양옆 벽 위에 얹고, 빗금 친 탭에 풀을 발라 벽 안쪽에 붙인다.</text>
<text x="24" y="102.3" font-size="3.2" dominant-baseline="central" text-anchor="start">4.</text>
<text x="29.4" y="102.3" font-size="3.2" dominant-baseline="central" text-anchor="start">아래쪽 발 두 개를 바깥으로 접어 눕히면 골대가 선다.</text>
<text x="24" y="107.7" font-size="3.2" dominant-baseline="central" text-anchor="start">5.</text>
<text x="29.4" y="107.7" font-size="3.2" dominant-baseline="central" text-anchor="start">운동장 골라인 안쪽 골대 자리에 입구가 필드를 향하도록 놓는다.</text>
