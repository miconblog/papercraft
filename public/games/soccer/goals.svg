<text x="189" y="70" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">발</text>
<text x="24" y="80" font-size="4" dominant-baseline="central" text-anchor="start">접는 법</text>
<text x="24" y="87.8" font-size="3.2" dominant-baseline="central" text-anchor="start">1.</text>
<text x="29.4" y="87.8" font-size="3.2" dominant-baseline="central" text-anchor="start">바깥 실선을 따라 오리고, 지붕 가운데 창도 오려서 떼어낸다.</text>
<text x="24" y="93" font-size="3.2" dominant-baseline="central" text-anchor="start">2.</text>
<text x="29.4" y="93" font-size="3.2" dominant-baseline="central" text-anchor="start">일점쇄선은 모두 인쇄면이 바깥으로 오게 접는다.</text>
<text x="24" y="98.2" font-size="3.2" dominant-baseline="central" text-anchor="start">3.</text>
<text x="29.4" y="98.2" font-size="3.2" dominant-baseline="central" text-anchor="start">뒷벽을 세우고 옆벽 둘을 앞으로 접는다. 바닥은 없다 — 공이 종이 위를 미끄러져 들어와야 한다.</text>
<text x="24" y="103.4" font-size="3.2" dominant-baseline="central" text-anchor="start">4.</text>
<text x="29.4" y="103.4" font-size="3.2" dominant-baseline="central" text-anchor="start">지붕을 앞으로 접어 양옆 벽 위에 얹고, 빗금 친 탭에 풀을 발라 벽 안쪽에 붙인다.</text>
<text x="24" y="108.6" font-size="3.2" dominant-baseline="central" text-anchor="start">5.</text>
<text x="29.4" y="108.6" font-size="3.2" dominant-baseline="central" text-anchor="start">아래쪽 발 두 개를 바깥으로 접어 눕히면 골대가 선다.</text>
<text x="24" y="113.8" font-size="3.2" dominant-baseline="central" text-anchor="start">6.</text>
<text x="29.4" y="113.8" font-size="3.2" dominant-baseline="central" text-anchor="start">골라인 바깥에 골문이 필드를 향하도록 놓고, 앞면 좌우를 운동장 눈금에 맞춘다.</text>
