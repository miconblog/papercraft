<text x="75" y="148" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">골대 2 바닥</text>
<rect x="59.125" y="167.05" width="31.75" height="3.9" fill="#ffffff" stroke="none" />
<text x="75" y="169" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">↑ 이 선을 골라인에 맞춘다</text>
<rect x="58.54" y="178.05" width="32.92" height="3.9" fill="#ffffff" stroke="none" />
<text x="75" y="180" font-size="2.6" dominant-baseline="central" fill="#6b7280" stroke="none" text-anchor="middle">입술 — 운동장 위에 얹는다</text>
<text x="152" y="32" font-size="4" dominant-baseline="central" text-anchor="start">접는 법</text>
<text x="152" y="40.1" font-size="3.2" dominant-baseline="central" text-anchor="start">1.</text>
<text x="157.4" y="40.1" font-size="3.2" dominant-baseline="central" text-anchor="start">바깥 실선을 따라 가위로 오린다. 오릴 곳은 바깥 선 하나뿐이다 — 칼로 뚫을</text>
<text x="157.4" y="45.5" font-size="3.2" dominant-baseline="central" text-anchor="start">곳이 없다.</text>
<text x="152" y="50.9" font-size="3.2" dominant-baseline="central" text-anchor="start">2.</text>
<text x="157.4" y="50.9" font-size="3.2" dominant-baseline="central" text-anchor="start">일점쇄선은 모두 인쇄면이 안쪽으로 오게 접는다. 방향은 전부 같다.</text>
<text x="152" y="56.3" font-size="3.2" dominant-baseline="central" text-anchor="start">3.</text>
<text x="157.4" y="56.3" font-size="3.2" dominant-baseline="central" text-anchor="start">뒷벽과 옆벽 둘을 세워 뚜껑 없는 쟁반을 만든다. 위는 뚫린 채로 둔다 — 들어간</text>
<text x="157.4" y="61.7" font-size="3.2" dominant-baseline="central" text-anchor="start">공을 보는 곳이다.</text>
<text x="152" y="67.1" font-size="3.2" dominant-baseline="central" text-anchor="start">4.</text>
<text x="157.4" y="67.1" font-size="3.2" dominant-baseline="central" text-anchor="start">뒷벽 양 끝의 탭을 앞으로 접어 옆벽 안쪽에 댄다.</text>
<text x="152" y="72.5" font-size="3.2" dominant-baseline="central" text-anchor="start">5.</text>
<text x="157.4" y="72.5" font-size="3.2" dominant-baseline="central" text-anchor="start">옆벽 위의 겹을 안쪽으로 접어 내려 탭을 문다. 양쪽 다 물리면 쟁반이 모양을</text>
<text x="157.4" y="77.9" font-size="3.2" dominant-baseline="central" text-anchor="start">잡는다 — 풀은 쓰지 않는다.</text>
<text x="152" y="83.3" font-size="3.2" dominant-baseline="central" text-anchor="start">6.</text>
<text x="157.4" y="83.3" font-size="3.2" dominant-baseline="central" text-anchor="start">골라인 밖에 놓고 앞으로 뻗은 입술을 운동장 위에 얹는다. 입술 좌우 끝을</text>
<text x="157.4" y="88.7" font-size="3.2" dominant-baseline="central" text-anchor="start">골라인 눈금에 맞추면 골문 가운데가 맞는다.</text>
