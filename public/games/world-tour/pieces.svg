<g id="pc-art" fill="#1a1a1a" stroke="none">
<text x="74" y="7.5" font-size="5" dominant-baseline="central" text-anchor="middle" font-weight="bold">말과 주사위</text>
<text x="74" y="12.5" font-size="2.6" dominant-baseline="central" text-anchor="middle" fill="#6b7280">두꺼운 종이에 뽑는다. 말은 원을 따라 오린다 — 한 사람이 하나씩, 2–6명.</text>
<text x="74" y="16.1" font-size="2.6" dominant-baseline="central" text-anchor="middle" fill="#6b7280">주사위는 바깥 실선을 오리고 파선을 안으로 접어, 빗금 면에 풀을 발라 붙인다.</text>
