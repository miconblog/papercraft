<text x="148.5" y="207.5" font-size="2.8" dominant-baseline="central" fill="#6b7280" text-anchor="middle">홀마다 친 횟수를 적는다. 아홉 칸을 더해 OUT과 IN을 내고, 둘을 더하면 총타수다. 거기서 72를 빼면 오늘의 성적이고, 지난 라운드를 빼면 지난번보다 나아진 만큼이다.</text>
