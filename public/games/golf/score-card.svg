<text x="43" y="166" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">이름</text>
<text x="88" y="166" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">전반(OUT)</text>
<text x="134" y="166" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">후반(IN)</text>
<text x="182" y="166" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">총타수</text>
<text x="241.5" y="166" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">파 72와 견주기</text>
<text x="18.5" y="174.25" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">1</text>
<text x="111" y="174.25" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">+</text>
<text x="157" y="174.25" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">=</text>
<text x="215" y="174.25" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">− 72 =</text>
<text x="18.5" y="182.75" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">2</text>
<text x="111" y="182.75" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">+</text>
<text x="157" y="182.75" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">=</text>
<text x="215" y="182.75" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">− 72 =</text>
<text x="18.5" y="191.25" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">3</text>
<text x="111" y="191.25" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">+</text>
<text x="157" y="191.25" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">=</text>
<text x="215" y="191.25" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">− 72 =</text>
<text x="18.5" y="199.75" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">4</text>
<text x="111" y="199.75" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">+</text>
<text x="157" y="199.75" font-size="5" dominant-baseline="central" fill="#1a1a1a" text-anchor="middle">=</text>
<text x="215" y="199.75" font-size="3.4" dominant-baseline="central" fill="#6b7280" text-anchor="middle">− 72 =</text>
<text x="148.5" y="207.5" font-size="2.8" dominant-baseline="central" fill="#6b7280" text-anchor="middle">홀마다 친 횟수를 적는다. 아홉 칸을 더해 OUT과 IN을 내고, 둘을 더하면 총타수다. 총타수에서 72를 빼면 오늘의 성적 — 적을수록 잘 친 것이다.</text>
